name: traffic-forecasting-ci

on:
  push:
  pull_request:

jobs:
  quality-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Create environment and install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock.txt
          .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Acquire and validate public source data
        run: make prepare
      - name: Fit using fit and validation blocks; preserve locked-test report
        run: make train
      - name: Tests and static checks
        run: make test quality
      - name: Interactive application smoke test
        run: make smoke-app
