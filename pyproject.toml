[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatiotemporal-traffic-forecasting"
version = "0.1.0"
description = "Chronological graph-aware traffic forecasting with sensor-outage evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "plotly>=5.24,<8",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "streamlit>=1.58,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
